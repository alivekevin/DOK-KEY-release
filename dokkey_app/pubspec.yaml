name: dokkey_app
description: "DOK-KEY - Global Daily Fortune Draw App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.3
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  home_widget: ^0.9.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/common/
    - assets/data/locales/ko/
    - assets/data/locales/en/
    - assets/data/locales/ja/
    - assets/data/locales/zh/
    - assets/data/locales/hi/
    - assets/data/locales/de/
    - assets/audio/
    - assets/images/
    - assets/images/2d_processed/
    - assets/images/animation/2d/
    - assets/images/kkaebi_face/
    - assets/cards/zodiac/
    - assets/cards/myth/
    - assets/images/kkaebi_3d/