  <script>
    function hideLoader() {
      var loader = document.getElementById('loading-container');
      if (loader && !loader.classList.contains('hidden')) {
        loader.classList.add('hidden');
        loader.style.transition = 'opacity 0.4s ease-out';
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 450);
      }
    }

    // 1. Flutter 첫 프레임 이벤트 수신 시 제거
    window.addEventListener('flutter-first-frame', hideLoader);

    // 2. Flutter DOM 렌더링 감지 시 제거
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
        hideLoader();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Fallback: 3.5초 후 자동 페이드아웃 (멈춤 현상 원천 차단)
    setTimeout(hideLoader, 3500);
  </script>

    if ('serviceWorker' in navigator) {

        for (var i = 0; i < registrations.length; i++) {

        }
      });
    }
    // 캐시 버스팅 적용된 flutter_bootstrap.js 동적 주입
    var bootScript = document.createElement('script');

    (function () {
      function applyVersion(ver) {
        if (!ver) return;
        var title = document.querySelector('.dokkey-web-title');
        var apk = document.querySelector('.dokkey-web-btn-apk');
        if (title) title.textContent = '🗝️ DOK-KEY 구글 플레이 정식 출시! (' + ver + ')';
        if (apk) apk.title = '최신 공식 APK 직접 다운로드 (' + ver + ')';
      }
      fetch('web/version.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (data) {
          if (data && data.version) { applyVersion('v' + data.version); return; }
          fetch('version.json', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) { if (d && d.version) applyVersion('v' + d.version); })
            .catch(function () {});

    })();
