  <style>
    body {
      background-color: #0A0C10;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Noto Sans SC", "Noto Sans Devanagari", sans-serif;
      color: #EAEFF8;
    }

    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1A1E29 0%, #0A0C10 70%);
      z-index: 9999;
      pointer-events: all;
    }

    .key-icon {
      font-size: 48px;
      margin-bottom: 20px;
      animation: keyBounce 2s ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(212, 175, 55, 0.5));
    }

    @keyframes keyBounce {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-10px) rotate(6deg) scale(1.08); }
    }

    .brand-name {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #D4AF37;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFF6D6 0%, #D4AF37 50%, #997A15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .loading-msg {
      font-size: 14px;
      color: #8E9BAE;
      margin-bottom: 24px;
      letter-spacing: -0.2px;
    }

    .spinner-bar {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .spinner-bar::after {
      content: '';
      position: absolute;
      left: -50%;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, transparent, #D4AF37, #FF5E36, transparent);
      border-radius: 4px;
      animation: sweep 1.4s ease-in-out infinite;
    }

    @keyframes sweep {
      0% { left: -50%; }
      100% { left: 100%; }
    }
  </style>

<body>
  <!-- DOK-KEY 구글 플레이 비공개 테스터 모집 플로팅 배너 & 위젯 -->
  <style>

      font-weight: 700;

      align-items: center;
      gap: 6px;
      color: #FFD700;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      z-index: 10000;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 10px rgba(212, 175, 55, 0.3);
      transition: all 0.25s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    .dokkey-web-float-btn:hover {
      transform: translateY(-2px) scale(1.04);
      border-color: #FFD700;
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
    }
    @media (max-width: 680px) {
      .dokkey-web-tester-banner {
        top: 8px;
        flex-direction: column;
        align-items: flex-start;
        padding: 8px 12px;
        gap: 8px;
      }
      .dokkey-web-actions {
        width: 100%;
        justify-content: space-between;
        gap: 4px;
      }
      .dokkey-web-btn {
        flex: 1;
        justify-content: center;
        padding: 6px 4px;
        font-size: 10px;
      }
      .dokkey-web-desc {
        display: none;
      }
    }
  </style>

  <div id="dokkey-web-banner" class="dokkey-web-tester-banner">
    <div class="dokkey-web-left">
      <div class="dokkey-web-badge">
        <span class="dokkey-web-pulse"></span> 테스터 모집
      </div>
      <div class="dokkey-web-info">
        <div class="dokkey-web-title">🗝️ DOK-KEY 테스터 모집 (v5.2.8)</div>
        <div class="dokkey-web-desc">최신 APK 직접 다운로드 또는 구글 플레이 비공개 테스터로 참여하세요</div>
      </div>
    </div>
    <div class="dokkey-web-actions">
      <a href="./app-release.apk" download class="dokkey-web-btn dokkey-web-btn-apk" title="최신 APK 직접 다운로드 (v5.2.8)">
        <span>📱 APK 다운로드</span>
      </a>
      <a href="https://groups.google.com/g/dokkey-testers" target="_blank" rel="noopener noreferrer" class="dokkey-web-btn dokkey-web-btn-step1" title="1단계: 구글 그룹스 가입">
        <span class="dokkey-web-step">1</span> 그룹 가입
      </a>
      <a href="https://play.google.com/apps/testing/com.dokkey.dokkey_app" target="_blank" rel="noopener noreferrer" class="dokkey-web-btn dokkey-web-btn-step2" title="2단계: 플레이스토어 테스터 다운로드">
        <span class="dokkey-web-step">2</span> 플레이스토어
      </a>
      <button type="button" class="dokkey-web-close" onclick="closeWebTesterBanner()" title="배너 닫기">&times;</button>
    </div>
  </div>

  <div id="dokkey-web-float" class="dokkey-web-float-btn" onclick="openWebTesterBanner()" style="display:none;" title="테스터 모집 안내 열기">
    <span class="dokkey-web-pulse"></span>
    <span>🗝️ 테스터 모집</span>
  </div>

  <script>
    function closeWebTesterBanner() {
      var banner = document.getElementById('dokkey-web-banner');
      var floatBtn = document.getElementById('dokkey-web-float');
      if (banner) banner.classList.add('hidden');
      if (floatBtn) floatBtn.style.display = 'flex';
      try { sessionStorage.setItem('dokkey_web_banner_closed', '1'); } catch(e) {}
    }
    function openWebTesterBanner() {
      var banner = document.getElementById('dokkey-web-banner');
      var floatBtn = document.getElementById('dokkey-web-float');
      if (banner) banner.classList.remove('hidden');
      if (floatBtn) floatBtn.style.display = 'none';
      try { sessionStorage.removeItem('dokkey_web_banner_closed'); } catch(e) {}
    }
    (function() {
      try {
        if (sessionStorage.getItem('dokkey_web_banner_closed') === '1') {
          var banner = document.getElementById('dokkey-web-banner');
          var floatBtn = document.getElementById('dokkey-web-float');
          if (banner) banner.classList.add('hidden');
          if (floatBtn) floatBtn.style.display = 'flex';
        }
      } catch(e) {}
    })();
  </script>

  <div id="loading-container">
    <div class="key-icon">🗝️</div>
    <div class="brand-name">DOK-KEY</div>
    <div class="loading-msg">도깨비의 열쇠를 불러오는 중...</div>
    <div class="spinner-bar"></div>
  </div>

  <script>
    function hideLoader() {
      var loader = document.getElementById('loading-container');
      if (loader && !loader.classList.contains('hidden')) {
        loader.classList.add('hidden');
        loader.style.transition = 'opacity 0.4s ease-out';
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 450);
      }
    }

    // 1. Flutter 첫 프레임 이벤트 수신 시 제거
    window.addEventListener('flutter-first-frame', hideLoader);

    // 2. Flutter DOM 렌더링 감지 시 제거
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
        hideLoader();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Fallback: 3.5초 후 자동 페이드아웃 (멈춤 현상 원천 차단)
    setTimeout(hideLoader, 3500);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
