    function closeWebTesterBanner() {
      var banner = document.getElementById('dokkey-web-banner');
      var floatBtn = document.getElementById('dokkey-web-float');
      if (banner) banner.classList.add('hidden');
      if (floatBtn) floatBtn.style.display = 'flex';
      try { sessionStorage.setItem('dokkey_web_banner_closed', '1'); } catch(e) {}
    }
    function openWebTesterBanner() {
      var banner = document.getElementById('dokkey-web-banner');
      var floatBtn = document.getElementById('dokkey-web-float');
      if (banner) banner.classList.remove('hidden');
      if (floatBtn) floatBtn.style.display = 'none';
      try { sessionStorage.removeItem('dokkey_web_banner_closed'); } catch(e) {}
    }
    (function() {
      try {
        if (sessionStorage.getItem('dokkey_web_banner_closed') === '1') {
          var banner = document.getElementById('dokkey-web-banner');
          var floatBtn = document.getElementById('dokkey-web-float');
          if (banner) banner.classList.add('hidden');
          if (floatBtn) floatBtn.style.display = 'flex';

  <script>
    (function() {

      var startTime = performance.now();
      var flutterReady = false;
      var introFinished = false;
      var soundEnabled = false;
      var animFrameId = null;
      var actIndex = 0;

      // 100% 동일한 크기/비율/받침대를 가진 3D 깨비 에셋만 엄선 (2D 작은 이미지 및 기와집 대문 완전 배제)
      var turnFrames = [
        'assets/assets/images/kkaebi_3d/kkaebi_turn_000.webp',
        'assets/assets/images/kkaebi_3d/kkaebi_turn_045.webp',
        'assets/assets/images/kkaebi_3d/kkaebi_turn_090.webp',
        'assets/assets/images/kkaebi_3d/kkaebi_turn_135.webp',
        'assets/assets/images/kkaebi_3d/kkaebi_turn_180.webp',
        'assets/assets/images/kkaebi_3d/kkaebi_turn_225.webp',
        'assets/assets/images/kkaebi_3d/kkaebi_turn_270.webp',
        'assets/assets/images/kkaebi_3d/kkaebi_turn_315.webp'
      ];
      var emo3DFrames = {
        normal: 'assets/assets/images/kkaebi_3d/kkaebi_emo_normal.webp',
        curious: 'assets/assets/images/kkaebi_3d/kkaebi_emo_curious.webp',
        shy: 'assets/assets/images/kkaebi_3d/kkaebi_emo_shy.webp',
        fire: 'assets/assets/images/kkaebi_3d/kkaebi_emo_fire.webp',
        shock: 'assets/assets/images/kkaebi_3d/kkaebi_emo_shock.webp',
        joy: 'assets/assets/images/kkaebi_3d/kkaebi_emo_joy.webp'
      };

      // 3D 이미지 프리로딩 실행
      turnFrames.concat(Object.values(emo3DFrames)).forEach(function(src) {
        var img = new Image();
        img.src = src;
      });

      // 사운드 효과 객체
      var sfx = {
        cast: new Audio('assets/assets/audio/kkaebi_cast_short.mp3'),
        key: new Audio('assets/assets/audio/key_turn.mp3'),
        unlock: new Audio('assets/assets/audio/unlock.mp3'),
        chime: new Audio('assets/assets/audio/chime.mp3')
      };
      Object.values(sfx).forEach(function(a) { a.volume = 0.55; });

      function playSfx(name) {
        if (!soundEnabled || !sfx[name]) return;
        try {
          sfx[name].currentTime = 0;
          sfx[name].play().catch(function() {});
        } catch (e) {}
      }

      window.toggleCinemaSound = function() {
        soundEnabled = !soundEnabled;
        var btn = document.getElementById('cinema-sound-btn');
        var icon = document.getElementById('cinema-sound-icon');
        var txt = document.getElementById('cinema-sound-text');
        if (soundEnabled) {
          if (btn) btn.classList.add('sound-active');
          if (icon) icon.textContent = '🔊';
          if (txt) txt.textContent = '효과음 ON';
          playSfx('chime');
        } else {
          if (btn) btn.classList.remove('sound-active');
          if (icon) icon.textContent = '🔇';
          if (txt) txt.textContent = '효과음 켜기';
        }
      };

      // =====================================================
      // HTML5 Canvas 도깨비불 & 황금 스파크 물리 파티클 엔진
      // =====================================================
      var canvas = document.getElementById('kkaebi-cinema-canvas');
      var ctx = canvas ? canvas.getContext('2d') : null;
      var particles = [];
      var shockwaves = [];

      function resizeCanvas() {
        if (!canvas) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      function createParticles(count, burstMode, colorTheme) {
        if (!canvas) return;
        var cx = canvas.width / 2;
        var cy = canvas.height * 0.43;
        for (var i = 0; i < count; i++) {
          var isGold = colorTheme === 'gold' ? true : (colorTheme === 'blue' ? false : (Math.random() > 0.5));
          var angle = Math.random() * Math.PI * 2;
          var dist = burstMode ? (Math.random() * 25) : (40 + Math.random() * Math.max(canvas.width, canvas.height) * 0.45);
          var speed = burstMode ? (2.5 + Math.random() * 6.0) : (0.4 + Math.random() * 1.4);
          particles.push({
            x: burstMode ? cx : cx + Math.cos(angle) * dist,
            y: burstMode ? cy : cy + Math.sin(angle) * dist,
            vx: burstMode ? Math.cos(angle) * speed : (Math.random() - 0.5) * 1.1,
            vy: burstMode ? Math.sin(angle) * speed : (-0.6 - Math.random() * 1.3),
            radius: burstMode ? (2 + Math.random() * 4.2) : (1.5 + Math.random() * 3.5),
            color: isGold ? '#FFD700' : '#38BDF8',
            glow: isGold ? 'rgba(255, 215, 0, 0.85)' : 'rgba(56, 189, 248, 0.85)',
            alpha: 0.35 + Math.random() * 0.65,
            life: burstMode ? (38 + Math.random() * 36) : 9999,
            orbiter: !burstMode && Math.random() > 0.38,
            orbitAngle: angle,
            orbitRadius: 85 + Math.random() * 130,
            orbitSpeed: (0.014 + Math.random() * 0.024) * (Math.random() > 0.5 ? 1 : -1)
          });
        }
      }
      createParticles(65, false);

      window.triggerCinemaSparkBurst = function(theme) {
        var useGold = theme !== 'blue';
        createParticles(36, true, useGold ? 'gold' : 'blue');
        if (canvas) {
          shockwaves.push({
            x: canvas.width / 2,
            y: canvas.height * 0.43,
            radius: 30,
            maxRadius: 270,
            alpha: 0.85,
            color: useGold ? '#FFD700' : '#38BDF8'
          });
        }
        var flash = document.getElementById('cinema-flash');
        if (flash) {
          flash.style.opacity = '0.6';
          setTimeout(function() { flash.style.opacity = '0'; }, 240);
        }
      };

      function renderCanvas() {
        if (!ctx || !canvas) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var cx = canvas.width / 2;
        var cy = canvas.height * 0.43;

        // 중앙 신비로운 오라 그라데이션
        var grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 240);
        if (actIndex >= 3) {
          grad.addColorStop(0, 'rgba(255, 215, 0, 0.26)');
          grad.addColorStop(0.5, 'rgba(245, 158, 11, 0.09)');
        } else {
          grad.addColorStop(0, 'rgba(56, 189, 248, 0.24)');
          grad.addColorStop(0.5, 'rgba(212, 175, 55, 0.08)');
        }
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, 240, 0, Math.PI * 2);
        ctx.fill();

        // 충격파 링 렌더링
        for (var s = shockwaves.length - 1; s >= 0; s--) {
          var sw = shockwaves[s];
          sw.radius += 7.5;
          sw.alpha *= 0.92;
          ctx.save();
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = Math.max(0, sw.alpha);
          ctx.lineWidth = 2.8;
          ctx.shadowColor = sw.color;
          ctx.shadowBlur = 16;
          ctx.stroke();
          ctx.restore();
          if (sw.alpha < 0.03 || sw.radius > sw.maxRadius) {
            shockwaves.splice(s, 1);
          }
        }

        // 도깨비불 & 황금 스파크 입자 업데이트
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          if (p.orbiter) {
            p.orbitAngle += p.orbitSpeed;
            var pull = actIndex === 2 ? 0.82 : 1.0;
            p.x = cx + Math.cos(p.orbitAngle) * (p.orbitRadius * pull);
            p.y = cy + Math.sin(p.orbitAngle) * (p.orbitRadius * pull * 0.85);
          } else {
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life < 25) p.alpha *= 0.9;
            if (p.y < -20) p.y = canvas.height + 10;
          }

          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
          ctx.shadowColor = p.glow;
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.restore();

          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      // =====================================================
      // 3D 깨비 단일 스케일 시네마틱 타임라인 디렉터
      // =====================================================
      function updateStoryTimeline(elapsed) {
        var progress = Math.min(100, (elapsed / TOTAL_DURATION) * 100);
        var bar = document.getElementById('cinema-progress-bar');
        if (bar) bar.style.width = progress + '%';

        var kkaebiImg = document.getElementById('cinema-kkaebi-img');
        var actLabel = document.getElementById('cinema-act-label');
        var subtitle = document.getElementById('cinema-subtitle');

        // [ACT 1] 0.0s ~ 1.9s: 3D 깨비 360도 부드러운 1회전 강림 (9프레임: 000 -> 315 -> 000)
        if (elapsed < 1900) {
          if (actIndex !== 1) {
            actIndex = 1;
            if (actLabel) actLabel.textContent = 'ACT I · 3D 깨비의 강림';
            if (subtitle) subtitle.textContent = '어둠을 밝히는 도깨비불처럼, 3D 깨비가 깨어납니다...';
            if (kkaebiImg) {
              kkaebiImg.classList.remove('fire-aura', 'gold-aura');
            }
          }
          var totalTurnSteps = turnFrames.length + 1; // 마지막 정면(000) 복귀 포함
          var step = Math.min(totalTurnSteps - 1, Math.floor((elapsed / 1900) * totalTurnSteps));
          var frameSrc = turnFrames[step % turnFrames.length];
          if (kkaebiImg && kkaebiImg.getAttribute('src') !== frameSrc) {
            kkaebiImg.setAttribute('src', frameSrc);
          }
        }
        // [ACT 2] 1.9s ~ 3.3s: 3D 도깨비불 각성 (동일 크기 3D 모델: 기운 응축 -> 푸른 도깨비불 점화)
        else if (elapsed < 3300) {
          if (actIndex !== 2) {
            actIndex = 2;
            if (actLabel) actLabel.textContent = 'ACT II · 푸른 도깨비불의 각성';
            if (subtitle) subtitle.textContent = '깨비의 방망이에 신비로운 도깨비불의 기운이 타오릅니다!';
            if (kkaebiImg) {
              kkaebiImg.classList.remove('gold-aura');
              kkaebiImg.classList.add('fire-aura');
            }
            window.triggerCinemaSparkBurst('blue');
            playSfx('cast');
          }
          var subElapsed = elapsed - 1900;
          var target3D = subElapsed < 420 ? emo3DFrames.curious : emo3DFrames.fire;
          if (kkaebiImg && kkaebiImg.getAttribute('src') !== target3D) {
            kkaebiImg.setAttribute('src', target3D);
          }
        }
        // [ACT 3] 3.3s ~ 4.8s: 3D 황금빛 환희 & 오늘의 운명 개방 (동일 크기 3D 모델: 방망이 번쩍 -> 별빛 환희)
        else {
          if (actIndex !== 3) {
            actIndex = 3;
            if (actLabel) actLabel.textContent = 'ACT III · 오늘의 지혜 잠금 해제';
            if (subtitle) subtitle.textContent = '오늘 하루를 여는 단 하나의 열쇠, DOK-KEY가 열립니다!';
            if (kkaebiImg) {
              kkaebiImg.classList.remove('fire-aura');
              kkaebiImg.classList.add('gold-aura');
            }
            window.triggerCinemaSparkBurst('gold');
            playSfx('unlock');
          }
          var act3Elapsed = elapsed - 3300;
          var finale3D = act3Elapsed < 350 ? emo3DFrames.shock : emo3DFrames.joy;
          if (kkaebiImg && kkaebiImg.getAttribute('src') !== finale3D) {
            kkaebiImg.setAttribute('src', finale3D);
          }
        }
      }

      function animateLoop(now) {
        if (introFinished) return;
        var elapsed = now - startTime;
        renderCanvas();
        updateStoryTimeline(elapsed);

        if (elapsed >= TOTAL_DURATION) {
          completeCinemaIntro(false);
          return;
        }
        animFrameId = requestAnimationFrame(animateLoop);
      }

      function completeCinemaIntro(forceImmediate) {
        if (introFinished) return;
        if (!forceImmediate && !flutterReady && (performance.now() - startTime < 6000)) {
          animFrameId = requestAnimationFrame(animateLoop);
          return;
        }
        introFinished = true;
        if (animFrameId) cancelAnimationFrame(animFrameId);

        var loader = document.getElementById('loading-container');
        if (loader) {
          loader.classList.add('cinema-exit');
          setTimeout(function() {
            loader.style.display = 'none';
            var replayBtn = document.getElementById('dokkey-intro-replay-btn');
            if (replayBtn && sessionStorage.getItem('dokkey_replay_dismissed') !== '1') {
              replayBtn.style.display = 'inline-flex';
            }
          }, 650);
        }
      }

      window.skipCinemaIntro = function() {
        completeCinemaIntro(true);
      };

      window.replayCinemaIntro = function() {
        var loader = document.getElementById('loading-container');
        var replayBtn = document.getElementById('dokkey-intro-replay-btn');
        if (!loader) return;
        if (replayBtn) replayBtn.style.display = 'none';

        if (!soundEnabled) {
          window.toggleCinemaSound();
        }

        introFinished = false;
        actIndex = 0;
        startTime = performance.now();
        loader.style.display = 'flex';
        void loader.offsetWidth;
        loader.classList.remove('cinema-exit');
        window.triggerCinemaSparkBurst('blue');
        animFrameId = requestAnimationFrame(animateLoop);
      };

      window.dismissReplayBtn = function(e) {
        if (e) e.stopPropagation();
        var replayBtn = document.getElementById('dokkey-intro-replay-btn');
        if (replayBtn) replayBtn.style.display = 'none';
        try { sessionStorage.setItem('dokkey_replay_dismissed', '1'); } catch (err) {}
      };

      function markFlutterReady() {
        flutterReady = true;
      }

      window.addEventListener('flutter-first-frame', markFlutterReady);

      var observer = new MutationObserver(function() {
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
          markFlutterReady();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      animFrameId = requestAnimationFrame(animateLoop);
    })();
  </script>

  <script>
    // 서비스 워커 강제 해제 (로컬 테스트 및 업데이트 시 캐시 갇힘 방지)

  </script>
  <script>
    // 🏷️ 테스터 배너 버전 라벨 자동 동기화 (version.json 기준 → 매 배포 수동 수정 불필요)
    (function () {
      function applyVersion(ver) {
        if (!ver) return;
        var title = document.querySelector('.dokkey-web-title');
        var apk = document.querySelector('.dokkey-web-btn-apk');
        if (title) title.textContent = '🗝️ DOK-KEY 테스터 모집 (' + ver + ')';
        if (apk) apk.title = '최신 APK 직접 다운로드 (' + ver + ')';
      }
      fetch('web/version.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (data) {
          if (data && data.version) { applyVersion('v' + data.version); return; }
          fetch('version.json', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) { if (d && d.version) applyVersion('v' + d.version); })
            .catch(function () {});
        });
    })();
  </script>
</body>
</html>
